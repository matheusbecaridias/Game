<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Guardiões da Escola</title>
    <style>
        @font-face {
            font-family: "Pixelify Sans";
            src: url("/assets/fonts/PixelifySans-Bold.woff2") format("woff2");
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }

        :root {
            color-scheme: dark;
            background: #08111f;
            color: #ffffff;
            font-family: "Pixelify Sans", Arial, Helvetica, sans-serif;
            font-weight: 700;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            min-width: 0;
            min-height: 0;
            margin: 0;
            overflow: hidden;
            background: #08111f;
        }

        html {
            height: 100%;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            padding: env(safe-area-inset-top) env(safe-area-inset-right)
                env(safe-area-inset-bottom) env(safe-area-inset-left);
            box-sizing: border-box;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            min-width: 0;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        canvas {
            display: block;
            max-width: 100%;
            max-height: 100%;
            touch-action: none;
        }

        

        @media (orientation: portrait) {
            #game-container {
                position: fixed;
                top: 0;
                left: 0;
                width: 100vh;
                height: 100vw;
                transform-origin: top left;
                transform: translateX(100vw) rotate(90deg);
            }
        }

        #profile-name-input::placeholder {
            font-family: "Pixelify Sans", Arial, Helvetica, sans-serif;
            font-weight: 700;
            color: #d6e3d8;
            opacity: 1;
        }

        #profile-name-input:focus {
            border-color: #f2c66d !important;
            box-shadow: 0 4px 0 rgba(54, 29, 15, 0.9), inset 0 0 0 2px rgba(255, 255, 255, 0.12) !important;
        }
    </style>
  <script type="module" crossorigin src="/assets/index-CEXMwQKx.js"></script>
</head>
<body>
    <div id="game-container"></div>
</body>
</html>
